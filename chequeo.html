<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSpace - Evaluación y Análisis de IA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-panel: rgba(11, 25, 56, 0.78);
      --card-bg: rgba(8, 20, 48, 0.85);
      --border-glow: rgba(56, 152, 255, 0.45);
      --accent: #38bdf8;
      --green: #22c55e;
      --text-main: #f0f6ff;
      --text-muted: #8ca6cc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background: radial-gradient(circle at 50% 20%, #0b2252 0%, #040c21 60%, #020612 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-frame {
      width: 100%;
      max-width: 980px;
      min-height: 590px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(14, 95, 224, 0.25);
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 64px;
      background: rgba(4, 12, 30, 0.78);
      border-right: 1px solid rgba(56, 152, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
      gap: 22px;
    }

    .nav-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
    }
    .nav-icon.active { background: rgba(38, 132, 255, 0.25); color: var(--accent); }

    .main-area {
      flex: 1;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand-logo { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-size: 1.25rem; font-weight: 700; }
    .brand-sub { font-size: 0.8rem; color: var(--accent); }
    .mission-meta { text-align: right; font-size: 0.82rem; color: var(--text-muted); }
    .mission-meta strong { color: var(--text-main); }

    .view { display: none; flex: 1; flex-direction: column; }
    .view.active { display: flex; }

    /* PANTALLA 5: CHAT DE EVALUACIÓN FÍSICA Y EMOCIONAL */
    .telemetry-strip {
      display: flex;
      gap: 14px;
      background: rgba(5, 15, 38, 0.8);
      border: 1px solid rgba(56, 152, 255, 0.25);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.82rem;
      margin-bottom: 14px;
      justify-content: space-between;
      align-items: center;
    }

    .telemetry-strip label { color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .telemetry-strip input {
      width: 58px;
      background: rgba(15, 35, 75, 0.9);
      border: 1px solid rgba(56, 152, 255, 0.4);
      border-radius: 6px;
      color: #fff;
      padding: 3px 6px;
      text-align: center;
    }

    .chat-container {
      flex: 1;
      background: rgba(6, 16, 40, 0.65);
      border: 1px solid rgba(56, 152, 255, 0.25);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      max-height: 330px;
    }

    .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 82%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(29, 116, 245, 0.25);
      border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .msg-row.ai .msg-bubble {
      background: rgba(15, 37, 82, 0.9);
      border: 1px solid rgba(56, 152, 255, 0.35);
      border-bottom-left-radius: 4px;
    }
    .msg-row.user .msg-bubble {
      background: linear-gradient(90deg, #1659c7, #2684ff);
      border-bottom-right-radius: 4px;
    }

    .quick-replies {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .chip {
      background: rgba(17, 45, 98, 0.8);
      border: 1px solid rgba(56, 152, 255, 0.4);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .chip:hover { border-color: var(--accent); background: rgba(38, 132, 255, 0.35); }

    .chat-input-bar {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .chat-input-bar input {
      flex: 1;
      padding: 13px 16px;
      background: rgba(6, 17, 41, 0.9);
      border: 1px solid rgba(56, 152, 255, 0.4);
      border-radius: 12px;
      color: #fff;
      font-size: 0.94rem;
      outline: none;
    }
    .btn-send {
      padding: 0 20px;
      background: linear-gradient(90deg, #1659c7, #2684ff);
      border: 1px solid #60a5fa;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* PANTALLA 6: ANÁLISIS DE INTELIGENCIA ARTIFICIAL */
    #view-analysis {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 24px;
    }

    #view-analysis h2 { font-size: 1.4rem; font-weight: 500; }

    .analysis-core {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      width: 100%;
      max-width: 720px;
      flex-wrap: wrap;
    }

    .brain-scanner {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(56, 189, 248, 0.55);
      animation: spin 10s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .checklist li {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      color: var(--text-muted);
      transition: 0.3s;
    }
    .checklist li.done { color: var(--text-main); font-weight: 500; }
    .check-circle {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
    }
    .checklist li.done .check-circle {
      border-color: var(--green);
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .progress-wrapper {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .progress-track {
      flex: 1;
      height: 10px;
      background: rgba(8, 22, 52, 0.9);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(56, 152, 255, 0.3);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1d74f5, #38bdf8);
      box-shadow: 0 0 12px #38bdf8;
      transition: width 0.2s ease;
    }
    .progress-pct { font-weight: 600; color: var(--accent); min-width: 44px; }
  </style>
</head>
<body>

  <div class="app-frame">
    <aside class="sidebar">
      <div class="nav-icon" onclick="window.location.href='2_dashboard_antecedentes.html'" title="Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </div>
      <div class="nav-icon active" title="Evaluación IA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
    </aside>

    <div class="main-area">
      <header class="top-header">
        <div class="brand-logo">
          <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
            <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          </svg>
          <div>
            <div class="brand-title">MediSpace</div>
            <div class="brand-sub">Crew Health Assistant</div>
          </div>
        </div>
        <div class="mission-meta">
          <div>Misión: <strong>STS-427</strong></div>
          <div id="utc-clock">14:33:24 UTC</div>
        </div>
      </header>

      <!-- PANTALLA 5: EVALUACIÓN FÍSICA Y EMOCIONAL -->
      <section id="view-chat" class="view active">
        <!-- Simulador de sensores biométricos del traje/estación para probar ambos escenarios (Estable vs Alerta) -->
        <div class="telemetry-strip">
          <span style="color:var(--accent); font-weight:600;">📡 Telemetría en vivo:</span>
          <label>FC (lpm): <input type="number" id="sensor-hr" value="62" min="40" max="180"></label>
          <label>SpO₂ (%): <input type="number" id="sensor-spo2" value="99" min="80" max="100"></label>
          <label>Temp (°C): <input type="number" id="sensor-temp" value="36.6" step="0.1"></label>
        </div>

        <div class="chat-container" id="chat-messages"></div>

        <div class="quick-replies" id="quick-replies">
          <button class="chip" onclick="sendQuickReply('Me siento bien y con energía :)')">Me siento bien :)</button>
          <button class="chip" onclick="sendQuickReply('Un poco fatigado tras la caminata EVA')">Fatiga leve tras EVA</button>
          <button class="chip" onclick="sendQuickReply('Tengo dolor de cabeza y algo de ansiedad')">Dolor de cabeza / estrés</button>
        </div>

        <form class="chat-input-bar" id="chat-form">
          <input type="text" id="chat-input" placeholder="Escribe tu respuesta..." autocomplete="off" required />
          <button type="submit" class="btn-send" title="Enviar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </form>
      </section>

      <!-- PANTALLA 6: ANÁLISIS DE INTELIGENCIA ARTIFICIAL -->
      <section id="view-analysis" class="view">
        <h2>Analizando tus respuestas...</h2>

        <div class="analysis-core">
          <div class="brain-scanner">
            <div class="pulse-ring"></div>
            <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5">
              <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.54Z"/>
              <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.54Z"/>
            </svg>
          </div>

          <ul class="checklist">
            <li id="step-1"><span class="check-circle">✓</span> Evaluación de respuestas</li>
            <li id="step-2"><span class="check-circle">✓</span> Comparación con historial</li>
            <li id="step-3"><span class="check-circle">✓</span> Análisis de parámetros</li>
          </ul>
        </div>

        <div class="progress-wrapper">
          <div class="progress-track">
            <div class="progress-fill" id="analysis-bar"></div>
          </div>
          <div class="progress-pct" id="analysis-pct">0%</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('medispace_session')) || { selectedProfile: { name: 'A. Rivera' } };
    const crewName = session.selectedProfile.name;

    // Flujo estructurado de chequeo obligatorio (Físico + Emocional + Actividades del día)
    const aiQuestions = [
      `¿Cómo te sientes hoy, ${crewName}?`,
      `¿Has tenido algún malestar físico o cambios en tu estado de ánimo?`,
      `¿Qué actividades principales tienes programadas hoy y realizaste tus ejercicios de resistencia?`
    ];

    const evaluationPayload = {
      crewMember: crewName,
      timestamp: new Date().toISOString(),
      conversation: [],
      vitals: {}
    };

    let currentStep = 0;
    const chatBox = document.getElementById('chat-messages');

    function appendMessage(sender, text) {
      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;
      const avatarSvg = sender === 'ai'
        ? `<svg width="18" height="18" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="4"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>`;

      row.innerHTML = `
        <div class="msg-avatar">${avatarSvg}</div>
        <div class="msg-bubble">${text}</div>
      `;
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Iniciar primera pregunta
    appendMessage('ai', aiQuestions[0]);

    function handleUserResponse(text) {
      if (!text.trim()) return;
      appendMessage('user', text);
      evaluationPayload.conversation.push({ question: aiQuestions[currentStep], answer: text });
      currentStep++;

      if (currentStep < aiQuestions.length) {
        setTimeout(() => {
          // TODO: Aquí puedes conectar tu endpoint de IA generativa (ej. Gemini API) para respuestas dinámicas
          appendMessage('ai', aiQuestions[currentStep]);
        }, 550);
      } else {
        setTimeout(() => {
          appendMessage('ai', 'Gracias. He registrado tus respuestas y signos vitales. Iniciando diagnóstico integral...');
          setTimeout(startAIAnalysis, 1100);
        }, 500);
      }
    }

    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const val = input.value;
      input.value = '';
      handleUserResponse(val);
    });

    function sendQuickReply(text) {
      handleUserResponse(text);
    }

    // Transición a Pantalla 6: Análisis de IA
    function startAIAnalysis() {
      evaluationPayload.vitals = {
        hr: Number(document.getElementById('sensor-hr').value),
        spo2: Number(document.getElementById('sensor-spo2').value),
        temp: Number(document.getElementById('sensor-temp').value)
      };

      // Evaluación lógica preliminar (Reemplazable por respuesta del modelo IA)
      const allAnswers = evaluationPayload.conversation.map(c => c.answer.toLowerCase()).join(' ');
      const hasSymptoms = /(dolor|ansiedad|mareo|malestar|estrés|fatiga|mal)/.test(allAnswers);
      const abnormalVitals = evaluationPayload.vitals.hr > 95 || evaluationPayload.vitals.hr < 50 || evaluationPayload.vitals.spo2 < 95;

      evaluationPayload.status = (hasSymptoms || abnormalVitals) ? 'ALERTA' : 'ESTABLE';
      evaluationPayload.stressLevel = hasSymptoms ? 'Moderado-Alto' : 'Bajo';

      localStorage.setItem('medispace_last_evaluation', JSON.stringify(evaluationPayload));

      document.getElementById('view-chat').classList.remove('active');
      document.getElementById('view-analysis').classList.add('active');

      // Animación de progreso 0 -> 100%
      let pct = 0;
      const bar = document.getElementById('analysis-bar');
      const pctText = document.getElementById('analysis-pct');

      const timer = setInterval(() => {
        pct += 5;
        bar.style.width = pct + '%';
        pctText.textContent = pct + '%';

        if (pct >= 30) document.getElementById('step-1').classList.add('done');
        if (pct >= 65) document.getElementById('step-2').classList.add('done');
        if (pct >= 95) document.getElementById('step-3').classList.add('done');

        if (pct >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            window.location.href = '4_resultados_alertas_historial.html';
          }, 600);
        }
      }, 120);
    }
  </script>
</body>
</html>
