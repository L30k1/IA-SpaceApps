<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSpace - Evaluación y Análisis de IA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/chequeo.css">
</head>
<body>
  <!--{% if false %}-->
  <main class="app-frame">
    <section class="main-area">
      <h1>MediSpace</h1>
      <p>Inicia el servidor con <code>python main.py</code> para usar los formularios y navegar.</p>
      <p><a href="http://127.0.0.1:5000/">Abrir MediSpace</a></p>
    </section>
  </main>
  <template>
  <!--{% endif %}-->

  <div class="app-frame">
    <aside class="sidebar">
      <a class="nav-icon" href="{{ url_for('profile') }}" aria-label="Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
      <div class="nav-icon active" title="Evaluación IA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
    </aside>

    <div class="main-area">
      <header class="top-header">
        <div class="brand-logo">
          <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
            <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          </svg>
          <div>
            <div class="brand-title">MediSpace</div>
            <div class="brand-sub">Crew Health Assistant</div>
          </div>
        </div>
        <div class="mission-meta">
          <div><strong>{{ expediente.astronauta.nombre }}</strong></div>
          <div id="utc-clock">{{ utc_clock }}</div>
        </div>
      </header>

      <!-- PANTALLA 5: EVALUACIÓN FÍSICA Y EMOCIONAL -->
      <section id="view-chat" class="view active">
        {% for message in get_flashed_messages() %}<p class="form-error" role="alert">{{ message }}</p>{% endfor %}
        {% if bloqueado %}
        <p role="status">{{ bloqueado }}</p>
        {% elif not draft %}
        <form class="checkup-form" method="post" action="{{ url_for('checkup') }}">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <p>La IA recibe tus respuestas y las mediciones que ingreses para preparar el seguimiento.</p>
          {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
          <button name="iniciar" value="1" type="submit" class="btn-send">Iniciar con IA</button>
        </form>
        {% else %}
        <form class="checkup-form" method="post" action="{{ url_for('checkup') }}">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <input type="hidden" name="turn" value="{{ draft['id'] }}:{{ draft['revision'] }}">
          <div class="telemetry-strip">
            <span class="telemetry-title">📡 Telemetría</span>
            <label>FC (lpm) <input type="number" name="hr" value="{{ vitals.hr if vitals.hr is not none else '' }}" min="1" max="999"></label>
            <label>SpO₂ (%) <input type="number" name="spo2" value="{{ vitals.spo2 if vitals.spo2 is not none else '' }}" min="0" max="100"></label>
            <label>Temp (°C) <input type="number" name="temp" value="{{ vitals.temp if vitals.temp is not none else '' }}" min="0.1" max="99.9" step="any"></label>
          </div>

          <div class="telemetry-strip checkup-context">
            <label>Misión
              <select name="mision_id">
                <option value="">Sin especificar</option>
                {% for mision in expediente.misiones %}
                <option value="{{ mision.id }}"{% if mision.id == details.mision_id %} selected{% endif %}>{{ mision.id }}</option>
                {% endfor %}
              </select>
            </label>
            <label>Fase
              <select name="fase">
                <option value="">Sin especificar</option>
                {% for clave, etiqueta in fases.items() %}
                <option value="{{ clave }}"{% if clave == details.fase %} selected{% endif %}>{{ etiqueta }}</option>
                {% endfor %}
              </select>
            </label>
            <label>Motivo <input name="motivo" value="{{ details.motivo | default('') }}" maxlength="200"></label>
            <label>Actividad <input name="actividad" value="{{ details.actividad | default('') }}" maxlength="200"></label>
          </div>

          <div class="chat-container" aria-label="Conversación">
            {% for message in messages %}
            <div class="msg-row {{ message.role }}">
              <div class="msg-bubble"><strong>{{ 'Asistente' if message.role == 'ai' else 'Tú' }}</strong><br>{{ message.text }}</div>
            </div>
            {% endfor %}
          </div>

          {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
          <div class="chat-input-bar">
            <input type="text" name="answer" aria-label="Tu respuesta" placeholder="Escribe tu respuesta..." value="{{ answer }}" maxlength="1000" autocomplete="off">
            <button type="submit" class="btn-send" name="accion" value="enviar">Enviar</button>
            <button type="submit" class="btn-send" name="accion" value="finalizar">Finalizar chequeo</button>
          </div>
        </form>
        {% endif %}
      </section>
    </div>
  </div>

  <!--{% if false %}-->
  </template>
  <!--{% endif %}-->
</body>
</html>
