{% if elevenlabs_disponible %}
<label class="voz-proveedor">
  <input type="checkbox" data-voz-elevenlabs="{{ url_for('audio_elevenlabs') }}">
  {{ t("Read with ElevenLabs") }}
  <small>{{ t("Turning this on sends ElevenLabs the text of the replies you play.") }}</small>
</label>
<p data-voz-diagnostico role="status"></p>
{% endif %}
<p>{{ t("A synthetic voice reads the responses. When enabled, ElevenLabs generates the audio with AI.") }}</p>
