<nav class="step-pills" aria-label="{{ t('Pruebas cognitivas') }}">
  {% for endpoint, etiqueta in [('pruebas_cognitivas', t('Praxis Motora')), ('prueba_volt', t('Aprendizaje visual de objetos (VOLT)')), ('prueba_lot', t('Orientación de línea (LOT)')), ('historial_cognitivo', t('Historial'))] %}
