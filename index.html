<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSpace - Acceso y Selección de Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <!--{% if false %}-->
  <main class="app-frame">
    <section class="main-area">
      <h1>MediSpace</h1>
      <p>Inicia el servidor con <code>python main.py</code> para usar los formularios y navegar.</p>
      <p><a href="http://127.0.0.1:5000/">Abrir MediSpace</a></p>
    </section>
  </main>
  <template>
  <!--{% endif %}-->

  <div class="app-frame">
    
    <!-- PANTALLA 1: REGISTRO E INICIO DE SESIÓN -->
    <section id="view-auth" class="view active">
      <div class="brand-logo vertical">
        <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
          <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          <path d="M24 32H28L30.5 26L34 38L36.5 32H40" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="brand-title">MediSpace</div>
          <div class="brand-sub">Crew Health Assistant</div>
        </div>
      </div>

      <form id="auth-form" class="auth-box" method="post" enctype="multipart/form-data" action="{{ url_for('index', mode=mode) }}">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        {% for message in get_flashed_messages() %}<p class="form-error" role="alert">{{ message }}</p>{% endfor %}
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        {% if mode in ['register', 'login-json'] %}
        <label for="expediente">Expediente del astronauta (.json)</label>
        <input id="expediente" name="expediente" type="file" accept=".json,application/json" required>
        {% endif %}

        {% if mode != 'login-json' %}
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input type="email" id="input-email" name="email" aria-label="Correo electrónico" value="{{ email }}" maxlength="254" autocomplete="email" placeholder="Correo electrónico" required />
        </div>
        {% endif %}

        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="input-password" name="password" aria-label="Contraseña" maxlength="128" {% if mode == 'register' %}minlength="8"{% endif %} autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}" placeholder="Contraseña" required />
        </div>

        <button type="submit" class="btn-primary" id="btn-auth-submit">{{ {'register': 'Crear cuenta', 'login-json': 'Iniciar sesión con JSON', 'login': 'Iniciar sesión'}[mode] }} →</button>

        {% if mode != 'register' %}
        <div class="auth-switch">
          {% if mode == 'login-json' %}
          <a href="{{ url_for('index') }}">Iniciar sesión con correo</a>
          {% else %}
          <a href="{{ url_for('index', mode='login-json') }}">Iniciar sesión con JSON</a>
          {% endif %}
        </div>
        {% endif %}

        <div class="auth-switch">
          {% if mode == 'register' %}
          <span>¿Ya tienes cuenta?</span> <a href="{{ url_for('index') }}">Iniciar sesión</a>
          {% else %}
          <span>¿No tienes cuenta?</span> <a href="{{ url_for('index', mode='register') }}">Crear cuenta</a>
          {% endif %}
        </div>
      </form>
    </section>

    <!-- PANTALLA 2: SELECCIÓN DE PERFIL -->
  </div>

  <!--{% if false %}-->
  </template>
  <!--{% endif %}-->
</body>
</html>
