<!DOCTYPE html>
<html lang="{{ idioma }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ t('MediSpace - Acceso') }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='interfaz.css') }}">
  <script src="{{ url_for('idioma_script') }}" defer></script>
</head>
<body>
  <!--{% if false %}-->
  <main class="app-frame">
    <section class="main-area">
      <h1>MediSpace</h1>
      <p>Inicia el servidor con <code>python main.py</code> para usar los formularios y navegar.</p>
      <p><a href="http://127.0.0.1:5000/">Abrir MediSpace</a></p>
    </section>
  </main>
  <template>
  <!--{% endif %}-->

  <div class="app-frame">
    
    <!-- PANTALLA 1: REGISTRO E INICIO DE SESIÓN -->
    <section id="view-auth" class="view active">
        {% include '_selector_idioma.html' %}
      <div class="brand-logo vertical">
        <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
          <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          <path d="M24 32H28L30.5 26L34 38L36.5 32H40" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="brand-title">MediSpace</div>
          <div class="brand-sub">Crew Health Assistant</div>
        </div>
      </div>

      <form id="auth-form" class="auth-box" method="post"{% if mode == 'register' %} enctype="multipart/form-data"{% endif %} action="{{ url_for('index', mode=mode) }}">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        {% for message in get_flashed_messages() %}<p class="form-error" role="alert">{{ t(message) }}</p>{% endfor %}
        {% if error %}<p class="form-error" role="alert">{{ t(error) }}</p>{% endif %}
        <h1>{{ t('Crear cuenta') if mode == 'register' else t('Iniciar sesión') }}</h1>
        <label for="input-nombre">{{ t('Nombre completo') }}</label>
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
          <input type="text" id="input-nombre" name="nombre" aria-label="{{ t('Nombre completo') }}" value="{{ nombre }}" autocomplete="name" placeholder="{{ t('Nombre completo') }}" required />
        </div>
        <label for="input-id">{{ t('ID del astronauta') }}</label>
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M12 9h6m-6 5h6"/><circle cx="7" cy="10" r="1.5"/><path d="M4.5 16a2.5 2.5 0 0 1 5 0"/></svg>
          <input type="text" id="input-id" name="astronauta_id" aria-label="{{ t('ID del astronauta') }}" value="{{ identificador }}" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="{{ t('ID del astronauta') }}" required />
        </div>

        <label for="input-password">{{ t('Contraseña') }}</label>
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="input-password" name="password" aria-label="{{ t('Contraseña') }}" maxlength="128" {% if mode == 'register' %}minlength="8"{% endif %} autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}" placeholder="{{ t('Contraseña') }}" required />
        </div>

        {% if mode == 'register' %}
        <div class="historial-carga">
          <label for="expediente">{{ t('Historial médico (.json)') }}</label>
          <p id="ayuda-expediente">{{ t('El nombre y el ID deben coincidir con los del archivo.') }}</p>
          <input id="expediente" name="expediente" type="file" accept=".json,application/json" aria-describedby="ayuda-expediente" required>
          <button type="button" id="elegir-expediente-local" class="file-action" aria-describedby="ayuda-expediente" hidden>{{ t('Elegir historial JSON y permitir su actualización') }}</button>
          <p id="estado-expediente-local" role="status" hidden></p>
          <a class="historial-enlace" href="{{ url_for('preparar_historial') }}">{{ t('Crear un historial médico JSON') }}</a>
        </div>
        {% endif %}

        <button type="submit" class="btn-primary" id="btn-auth-submit">{{ t('Crear cuenta') if mode == 'register' else t('Iniciar sesión') }} →</button>

        <div class="auth-switch">
          {% if mode == 'register' %}
          <span>{{ t('¿Ya tienes cuenta?') }}</span> <a href="{{ url_for('index') }}">{{ t('Iniciar sesión') }}</a>
          {% else %}
          <span>{{ t('¿No tienes cuenta?') }}</span> <a href="{{ url_for('index', mode='register') }}">{{ t('Crear cuenta') }}</a>
          {% endif %}
        </div>
      </form>
    </section>

  </div>
  {% if mode == 'register' %}<script src="{{ url_for('expediente_local_script') }}" defer></script>{% endif %}

  <!--{% if false %}-->
  </template>
  <!--{% endif %}-->
</body>
</html>
