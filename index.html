<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSpace - Acceso y Selección de Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <!--{% if false %}-->
  <main class="app-frame">
    <section class="main-area">
      <h1>MediSpace</h1>
      <p>Inicia el servidor con <code>python main.py</code> para usar los formularios y navegar.</p>
      <p><a href="http://127.0.0.1:5000/">Abrir MediSpace</a></p>
    </section>
  </main>
  <template>
  <!--{% endif %}-->

  <div class="app-frame">
    
    <!-- PANTALLA 1: REGISTRO E INICIO DE SESIÓN -->
    {% if not selecting %}
    <section id="view-auth" class="view active">
      <div class="brand-logo vertical">
        <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
          <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          <path d="M24 32H28L30.5 26L34 38L36.5 32H40" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="brand-title">MediSpace</div>
          <div class="brand-sub">Crew Health Assistant</div>
        </div>
      </div>

      <form id="auth-form" class="auth-box" method="post" action="{{ url_for('index', mode=mode) }}">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        {% for message in get_flashed_messages() %}<p class="form-error" role="alert">{{ message }}</p>{% endfor %}
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        {% if mode == 'register' %}
        <div class="input-group" id="field-fullname">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="input-name" name="name" aria-label="Nombre" value="{{ name }}" maxlength="80" autocomplete="name" required placeholder="Nombre y rango (ej. A. Rivera)" />
        </div>
        {% endif %}

        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input type="email" id="input-email" name="email" aria-label="Correo electrónico" value="{{ email }}" maxlength="254" autocomplete="email" placeholder="Correo electrónico" required />
        </div>

        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="input-password" name="password" aria-label="Contraseña" maxlength="128" {% if mode == 'register' %}minlength="8"{% endif %} autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}" placeholder="Contraseña" required />
        </div>

        <button type="submit" class="btn-primary" id="btn-auth-submit">{{ 'Crear cuenta →' if mode == 'register' else 'Iniciar sesión →' }}</button>

        <div class="auth-switch">
          {% if mode == 'register' %}
          <span>¿Ya tienes cuenta?</span> <a href="{{ url_for('index') }}">Iniciar sesión</a>
          {% else %}
          <span>¿No tienes cuenta?</span> <a href="{{ url_for('index', mode='register') }}">Crear cuenta</a>
          {% endif %}
        </div>
      </form>
    </section>

    <!-- PANTALLA 2: SELECCIÓN DE PERFIL -->
    {% else %}
    <section id="view-profile" class="view active">
      <aside class="sidebar">
        <div class="nav-icon active" title="Perfil">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </div>
        <div class="nav-icon" title="Signos Vitales">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div class="nav-icon" title="Historial">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div class="nav-icon" title="Ajustes">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
      </aside>

      <div class="main-area">
        <header class="top-header">
          <div class="brand-logo small">
            <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
              <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
              <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
            </svg>
            <div>
              <div class="brand-title">MediSpace</div>
              <div class="brand-sub">Crew Health Assistant</div>
            </div>
          </div>
          <div class="mission-meta">
            <div>Misión: <strong>STS-427</strong></div>
            <div id="utc-clock">{{ utc_clock }}</div>
          </div>
        </header>

        <form class="profile-section" method="post" action="{{ url_for('index') }}">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <h2>Selecciona tu perfil</h2>
          {% for message in get_flashed_messages() %}<p class="form-error" role="alert">{{ message }}</p>{% endfor %}

          <div class="profiles-grid" id="profiles-container">
            <!-- Perfil 1 -->
            <label class="profile-card">
              <input type="radio" name="profile" value="AS-2743" required checked>
              <div class="avatar-box">
                <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.5">
                  <circle cx="12" cy="9" r="5"/>
                  <path d="M8.5 8.5a4 4 0 0 1 7 0" stroke="#38bdf8"/>
                  <path d="M4 21v-2a7 7 0 0 1 16 0v2"/>
                </svg>
              </div>
              <div class="profile-role">Astronauta</div>
              <div class="profile-sub">Comandante / EVA</div>
            </label>

            <!-- Perfil 2 -->
            <label class="profile-card">
              <input type="radio" name="profile" value="SC-1092" required>
              <div class="avatar-box">
                <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                  <path d="M9 14l3 3 3-3"/>
                </svg>
              </div>
              <div class="profile-role">Investigadora</div>
              <div class="profile-sub">Biomedicina Orbital</div>
            </label>

            <!-- Perfil 3 -->
            <label class="profile-card">
              <input type="radio" name="profile" value="EN-4410" required>
              <div class="avatar-box">
                <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="1.5">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                  <rect x="9" y="15" width="6" height="4" rx="1"/>
                </svg>
              </div>
              <div class="profile-role">Ingeniero</div>
              <div class="profile-sub">Soporte Vital</div>
            </label>
          </div>

          <div class="btn-continue-wrap">
            <button type="submit" class="btn-primary">Continuar →</button>
          </div>
        </form>
        <form class="logout-form" method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button type="submit">Cerrar sesión</button>
        </form>
      </div>
    </section>
    {% endif %}
  </div>

  <!--{% if false %}-->
  </template>
  <!--{% endif %}-->
</body>
</html>
