<nav class="selector-idioma" aria-label="{{ t("Language") }}">
  {% for code, label in [('en', 'English'), ('es', 'Spanish' if language == 'en' else 'Español')] %}
  <a href="{{ language_url(code) }}" lang="{{ 'en' if language == 'en' else code }}" hreflang="{{ code }}"{% if code == language %} aria-current="true"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
