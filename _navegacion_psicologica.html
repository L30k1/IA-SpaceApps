<nav class="step-pills" aria-label="{{ t("Psychological support") }}">
  {% for clave_modulo, label in [('diario', t("Daily")), ('semanal', t("Weekly")), ('chat', t("Support chat"))] %}
  <a class="step-pill{{ ' enlace-chat-apoyo' if clave_modulo == 'chat' else '' }}{{ ' active' if module == clave_modulo else '' }}"
     href="{{ url_for('chat_psicologico') if clave_modulo == 'chat' else url_for('registro_psicologico', module=clave_modulo) }}"
     {% if module == clave_modulo %}aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
