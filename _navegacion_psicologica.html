<nav class="step-pills" aria-label="Atención psicológica">
  {% for clave_modulo, etiqueta in [('diario', 'Diario'), ('semanal', 'Semanal')] %}
  <a class="step-pill{{ ' active' if modulo == clave_modulo else '' }}"
     href="{{ url_for('registro_psicologico', modulo=clave_modulo) }}"
     {% if modulo == clave_modulo %}aria-current="page"{% endif %}>{{ etiqueta }}</a>
  {% endfor %}
</nav>
