<nav class="step-pills" aria-label="{{ t('Atención psicológica') }}">
  {% for clave_modulo, etiqueta in [('diario', t('Diario')), ('semanal', t('Semanal')), ('chat', t('Chat de apoyo'))] %}
  <a class="step-pill{{ ' enlace-chat-apoyo' if clave_modulo == 'chat' else '' }}{{ ' active' if modulo == clave_modulo else '' }}"
     href="{{ url_for('chat_psicologico') if clave_modulo == 'chat' else url_for('registro_psicologico', modulo=clave_modulo) }}"
     {% if modulo == clave_modulo %}aria-current="page"{% endif %}>{{ etiqueta }}</a>
  {% endfor %}
</nav>
