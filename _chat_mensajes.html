{% macro historial_chat(turns) %}
<ol class="chat-mensajes" data-chat-mensajes role="log" aria-label="{{ t('Conversación') }}">
  {% for message in turns %}
  <li class="chat-turno{% if message.role == 'user' %} chat-turno-usuario{% endif %}"{% if loop.last %} id="ultimo-mensaje"{% endif %}>
    <strong>{{ t("You") if message.role == 'user' else t("AI") }}</strong>
    <p{% if message.role == 'ai' %} data-voz-respuesta{% endif %}>{{ message.text | ai_reply if message.role == 'ai' else message.text }}</p>
  </li>
  {% endfor %}
</ol>
{% endmacro %}
