<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSpace - Resultados, Alertas e Historial</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/resumen.css">
</head>
<body>
  <!--{% if false %}-->
  <main class="app-frame">
    <section class="main-area">
      <h1>MediSpace</h1>
      <p>Inicia el servidor con <code>python main.py</code> para usar los formularios y navegar.</p>
      <p><a href="http://127.0.0.1:5000/">Abrir MediSpace</a></p>
    </section>
  </main>
  <template>
  <!--{% endif %}-->

  <div class="app-frame">
    <aside class="sidebar">
      <a class="nav-icon" href="{{ url_for('profile') }}" aria-label="Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
      <div class="nav-icon active" title="Resultados e Historial">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
    </aside>

    <div class="main-area">
      <header class="top-header">
        <div class="brand-logo">
          <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
            <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          </svg>
          <div>
            <div class="brand-title">MediSpace</div>
            <div class="brand-sub">Crew Health Assistant</div>
          </div>
        </div>
        <div class="mission-meta">
          <div><strong>{{ expediente.astronauta.nombre }}</strong></div>
          <div id="utc-clock">{{ utc_clock }}</div>
        </div>
      </header>

      {% macro mediciones(registro) %}
        {% for medida in registro.mediciones %}
        <li>{{ signos[medida.tipo][0] if medida.tipo in signos else medida.tipo }}: {{ medida.valor }} {{ medida.unidad }}</li>
        {% else %}
        <li>Sin mediciones registradas</li>
        {% endfor %}
      {% endmacro %}
      <nav class="step-pills" aria-label="Resumen del chequeo">
        <a class="step-pill{{ ' active' if view == 'resultados' else '' }}" href="{{ url_for('summary', registro=latest.clave if latest else none) }}">Resultados</a>
        {% if latest and (latest.evaluacion_ia or latest.estado in ['ALERTA', 'INDETERMINADO']) %}
        <a class="step-pill{{ ' active' if view == 'alertas' else '' }}" href="{{ url_for('summary', vista='alertas', registro=latest.clave) }}">Seguimiento</a>
        {% endif %}
        <a class="step-pill{{ ' active' if view == 'historial' else '' }}" href="{{ url_for('summary', vista='historial') }}">Historial clínico</a>
      </nav>

      <section class="view active">
        {% if view in ['historial', 'resultados'] %}
        <div id="archivo-local" class="info-card" data-expediente-id="{{ expediente._id }}"
             data-url="{{ url_for('download_expediente') }}" data-auto="{{ '1' if actualizar_archivo else '0' }}" hidden>
          <h3>Archivo JSON original</h3>
          <p id="estado-archivo-local" role="status"></p>
          <div class="file-actions">
            <button id="vincular-archivo-local" type="button" class="step-pill" hidden>Vincular archivo original</button>
            <button id="guardar-archivo-local" type="button" class="step-pill" hidden>Actualizar archivo original</button>
          </div>
        </div>
        {% endif %}
        {% if view == 'historial' %}
        <h2 class="history-heading">Historial clínico de {{ expediente.astronauta.nombre }}</h2>
        <a class="step-pill" href="{{ url_for('download_expediente') }}">Descargar expediente JSON</a>
        {% include '_datos_expediente.html' %}
        <h3>Chequeos</h3>
        {% for registro in records %}
        <article class="info-card">
          <h3><a href="{{ url_for('summary', registro=registro.clave) }}">{{ registro.fecha_hora | hora_utc }}</a></h3>
          <p>{{ registro.motivo or 'Motivo sin registrar' }}{% if registro.mision_id %} · {{ registro.mision_id }}{% endif %}{% if registro.fase %} · {{ fases[registro.fase] }}{% endif %}</p>
          <ul>{{ mediciones(registro) }}</ul>
          {% if registro.evaluacion and registro.evaluacion.estado_revision %}
          <p>Revisión: {{ registro.evaluacion.estado_revision }}</p>
          {% endif %}
        </article>
        {% else %}
        <p>Sin chequeos guardados.</p>
        {% endfor %}
        <a class="btn-primary" href="{{ url_for('profile') }}">Volver al perfil</a>
        {% elif not latest %}
        <div class="info-card">
          <h2>Sin chequeos guardados</h2>
          <a class="btn-primary" href="{{ url_for('checkup') }}">Iniciar chequeo</a>
        </div>
        {% elif view == 'alertas' %}
        <div class="status-banner{{ ' alert' if latest.estado == 'ALERTA' else '' }}">
          <div>
            <h2>{{ etiquetas_resultado.get(latest.estado, 'Sin seguimiento registrado') }}</h2>
          </div>
        </div>
        {% if not latest.evaluacion_ia and latest.estado == 'ALERTA' %}
        <p>Este chequeo se guardó antes de habilitar la evaluación de Gemini.</p>
        {% endif %}
        {% include '_seguimiento_alerta.html' %}
        <a class="btn-primary" href="{{ url_for('summary', vista='historial') }}">Ver historial</a>
        {% else %}
        <div class="status-banner{{ ' alert' if latest.estado == 'ALERTA' else '' }}">
          <div>
            <h2>Resultados del chequeo</h2>
            <p>{{ latest.fecha_hora | hora_utc }}{% if latest.estado in etiquetas_resultado %} · {{ etiquetas_resultado[latest.estado] }}{% endif %}</p>
          </div>
        </div>
        <div class="two-cols">
          <div class="info-card">
            <h3>Datos del chequeo</h3>
            <ul>
              <li>Misión: {{ latest.mision_id or 'Sin registrar' }}</li>
              <li>Fase: {{ fases.get(latest.fase, 'Sin registrar') }}</li>
              <li>Motivo: {{ latest.motivo or 'Sin registrar' }}</li>
              <li>Actividad: {{ latest.actividad or 'Sin registrar' }}</li>
            </ul>
          </div>
          <div class="info-card">
            <h3>Mediciones</h3>
            <ul>{{ mediciones(latest) }}</ul>
          </div>
        </div>
        {% include '_seguimiento_alerta.html' %}
        {% if latest.evaluacion %}
        <div class="info-card">
          <h3>Evaluación y seguimiento</h3>
          <ul>
            <li>Revisión: {{ latest.evaluacion.estado_revision or 'Sin registrar' }}</li>
            <li>Acción: {{ latest.evaluacion.accion_acordada or 'Sin registrar' }}</li>
            <li>Fecha de seguimiento: {{ latest.evaluacion.fecha_seguimiento or 'Sin registrar' }}</li>
          </ul>
        </div>
        {% endif %}
        {% if latest.conversacion %}
        <div class="info-card">
          <h3>Conversación del chequeo</h3>
          <ul>
            {% for message in latest.conversacion %}
            <li><strong>{{ 'Asistente' if message.role == 'ai' else 'Tú' }}</strong> {{ message.text }}</li>
            {% endfor %}
          </ul>
        </div>
        {% endif %}
        <details class="info-card">
          <summary>Consultar antecedentes del expediente</summary>
          {% include '_datos_expediente.html' %}
        </details>
        <a class="btn-primary" href="{{ url_for('summary', vista='historial') }}">Ver historial</a>
        {% endif %}
      </section>
    </div>
  </div>
  <script src="{{ url_for('expediente_local_script') }}" defer></script>

  <!--{% if false %}-->
  </template>
  <!--{% endif %}-->
</body>
</html>
