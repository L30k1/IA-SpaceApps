<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSpace - Resultados, Alertas e Historial</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/resumen.css">
</head>
<body>
  <!--{% if false %}-->
  <main class="app-frame">
    <section class="main-area">
      <h1>MediSpace</h1>
      <p>Inicia el servidor con <code>python main.py</code> para usar los formularios y navegar.</p>
      <p><a href="http://127.0.0.1:5000/">Abrir MediSpace</a></p>
    </section>
  </main>
  <template>
  <!--{% endif %}-->

  <div class="app-frame">
    <aside class="sidebar">
      <a class="nav-icon" href="{{ url_for('profile') }}" aria-label="Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
      <div class="nav-icon active" title="Resultados e Historial">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
    </aside>

    <div class="main-area">
      <header class="top-header">
        <div class="brand-logo">
          <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
            <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          </svg>
          <div>
            <div class="brand-title">MediSpace</div>
            <div class="brand-sub">Crew Health Assistant</div>
          </div>
        </div>
        <div class="mission-meta">
          <div>Misión: <strong>STS-427</strong></div>
          <div id="utc-clock">{{ utc_clock }}</div>
        </div>
      </header>

      <nav class="step-pills" aria-label="Resumen del chequeo">
        {% for key, label in [('resultados', 'Resultados'), ('alertas', 'Alertas simuladas'), ('historial', 'Historial')] %}
        <a class="step-pill{{ ' active' if view == key else '' }}" href="{{ url_for('summary', vista=key) }}">{{ label }}</a>
        {% endfor %}
      </nav>

      <section class="view active">
        {% if not latest %}
        <div class="info-card">
          <h2>Sin chequeos guardados</h2>
          <a class="btn-primary" href="{{ url_for('checkup') }}">Iniciar chequeo</a>
        </div>
        {% elif view == 'resultados' %}
        <div class="status-banner{{ ' alert' if latest.status == 'ALERTA' else '' }}">
          <div>
            <h2>Chequeo simulado: {{ latest.status }}</h2>
            <p>Registro del {{ latest.finished_at }}</p>
          </div>
        </div>
        <div class="two-cols">
          <div class="info-card">
            <h3>Telemetría registrada</h3>
            <ul>
              <li>FC: {{ latest.hr }} lpm</li>
              <li>SpO₂: {{ latest.spo2 }}%</li>
              <li>Temperatura: {{ latest.temp }} °C</li>
            </ul>
          </div>
          <div class="info-card">
            <h3>Conversación del chequeo</h3>
            <ul>
              {% for message in messages %}
              <li><strong>{{ 'Asistente' if message.role == 'ai' else 'Tú' }}</strong> {{ message.text }}</li>
              {% endfor %}
            </ul>
          </div>
        </div>
        <a class="btn-primary" href="{{ url_for('summary', vista='alertas' if latest.status == 'ALERTA' else 'historial') }}">Continuar →</a>
        {% elif view == 'alertas' %}
        <div class="status-banner{{ ' alert' if latest.status == 'ALERTA' else '' }}">
          <div>
            {% if latest.status == 'ALERTA' %}
            <h2>Alerta de demostración</h2>
            <p>Los datos del chequeo activaron las reglas del simulador. La alerta solo aparece en esta aplicación.</p>
            {% else %}
            <h2>Sin alertas simuladas</h2>
            <p>El último chequeo se guardó con estado estable.</p>
            {% endif %}
          </div>
        </div>
        <a class="btn-primary" href="{{ url_for('summary', vista='historial') }}">Ver historial →</a>
        {% else %}
        <h2 class="history-heading">Historial de chequeos simulados</h2>
        <div class="history-table-scroll">
          <table class="history-table">
            <thead>
              <tr><th>Fecha UTC</th><th>FC</th><th>SpO₂</th><th>Temp.</th><th>Estado simulado</th></tr>
            </thead>
            <tbody>
              {% for record in records %}
              <tr>
                <td>{{ record.finished_at }}</td>
                <td>{{ record.hr }} lpm</td>
                <td>{{ record.spo2 }}%</td>
                <td>{{ record.temp }} °C</td>
                <td class="{{ 'status-alert' if record.status == 'ALERTA' else 'status-stable' }}">{{ record.status }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
        <a class="btn-primary" href="{{ url_for('profile') }}">← Volver al dashboard</a>
        {% endif %}
      </section>
    </div>
  </div>

  <!--{% if false %}-->
  </template>
  <!--{% endif %}-->
</body>
</html>
