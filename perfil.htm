<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSpace - Dashboard y Antecedentes Médicos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
  <!--{% if false %}-->
  <main class="app-frame">
    <section class="main-area">
      <h1>MediSpace</h1>
      <p>Inicia el servidor con <code>python main.py</code> para usar los formularios y navegar.</p>
      <p><a href="http://127.0.0.1:5000/">Abrir MediSpace</a></p>
    </section>
  </main>
  <template>
  <!--{% endif %}-->

  {% set modulos = [('psicologia', 'Atención psicológica'), ('cognicion', 'Pruebas cognitivas')] %}
  {% macro icono_modulo(tipo, tamano) %}
  <svg width="{{ tamano }}" height="{{ tamano }}" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if tipo == 'psicologia' %}
    <path d="M18 20h-5v-3h-2l-2-2v-2H7l2-3a6 6 0 1 1 9 5z"/>
    <path d="m14 10 1 1 2-2"/>
    {% else %}
    <rect x="6" y="5" width="12" height="16" rx="2"/>
    <rect x="9" y="3" width="6" height="4" rx="1"/>
    <path d="m9 12 1 1 2-2m2 1h2m-7 5h7"/>
    {% endif %}
  </svg>
  {% endmacro %}

  <div class="app-frame">
    <!-- SIDEBAR DE NAVEGACIÓN -->
    <nav class="sidebar" aria-label="Navegación del perfil">
      <a class="nav-icon active" href="{{ url_for('profile') }}" aria-label="Dashboard principal" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
      <a class="nav-icon" href="{{ url_for('summary', vista='historial') }}" aria-label="Antecedentes médicos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </a>
      {% for tipo, nombre in modulos %}
      {% if tipo == 'psicologia' %}
      <a class="nav-icon" href="{{ url_for('registro_psicologico', modulo='diario') }}" title="{{ nombre }}" aria-label="{{ nombre }}">
        {{ icono_modulo(tipo, 20) }}
      </a>
      {% else %}
      <a class="nav-icon" href="{{ url_for('pruebas_cognitivas') }}" title="{{ nombre }}" aria-label="{{ nombre }}">
        {{ icono_modulo(tipo, 20) }}
      </a>
      {% endif %}
      {% endfor %}
    </nav>

    <div class="main-area">
      <!-- ENCABEZADO -->
      <header class="top-header">
        <div class="brand-logo">
          <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
            <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          </svg>
          <div>
            <div class="brand-title">MediSpace</div>
            <div class="brand-sub">Crew Health Assistant</div>
          </div>
        </div>
        <div class="mission-meta">
          <div><strong>{{ expediente.astronauta.nombre }}</strong></div>
          <div id="utc-clock">{{ utc_clock }}</div>
        </div>
      </header>

      <!-- PANTALLA 3: DASHBOARD PRINCIPAL -->
      <section id="view-dashboard" class="view active">
        {% for mensaje in get_flashed_messages() %}<p role="alert">{{ mensaje }}</p>{% endfor %}
        <div class="dashboard-grid">
          <div class="left-col">
            <!-- Perfil del Astronauta -->
            <div class="crew-header-card">
              <div class="crew-avatar">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="1.8">
                  <circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                </svg>
              </div>
              <div class="crew-info">
                <h2 id="crew-name">{{ expediente.astronauta.nombre }}</h2>
                <div class="crew-id" id="crew-id">ID: {{ expediente._id }} · Astronauta</div>
              </div>
            </div>

            <!-- Estado de Salud y Chequeos -->
            <div class="health-status-card">
              <div class="health-top">
                <div class="health-indicator">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    <polyline points="9 12 11 14 15 10"/>
                  </svg>
                  <div>
                    <div class="health-label">Último chequeo</div>
                    <div class="health-value" id="overall-health-status">{{ etiquetas_resultado.get(latest.estado, latest.estado or 'Importado') if latest else 'Sin registros' }}</div>
                  </div>
                </div>
              </div>

              <div class="schedule-list">
                <div class="schedule-item">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <div>Último monitoreo:<strong id="last-checkup">{{ (latest.fecha_hora | hora_utc) if latest else 'Sin registros' }}</strong></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Accesos Directos -->
          <div class="right-col">
            <form method="post" action="{{ url_for('checkup') }}">
              <input type="hidden" name="csrf" value="{{ csrf }}">
              <button class="btn-primary" type="submit" name="iniciar" value="1">Iniciar monitoreo →</button>
            </form>
            <a class="action-tile" href="{{ url_for('summary', vista='historial') }}">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
              </svg>
              <span>Historial médico</span>
            </a>

            <div class="module-actions">
              {% for tipo, nombre in modulos %}
              {% if tipo == 'psicologia' %}
              <a class="action-tile" href="{{ url_for('registro_psicologico', modulo='diario') }}">
                {{ icono_modulo(tipo, 26) }}
                <span>{{ nombre }}</span>
                <small>Diario, semanal y chat</small>
              </a>
              {% else %}
              <a class="action-tile" href="{{ url_for('pruebas_cognitivas') }}">
                {{ icono_modulo(tipo, 26) }}
                <span>{{ nombre }}</span>
                <small>Praxis Motora, VOLT y LOT</small>
              </a>
              {% endif %}
              {% endfor %}
            </div>
            <form method="post" action="{{ url_for('logout') }}">
              <input type="hidden" name="csrf" value="{{ csrf }}">
              <button class="btn-secondary" type="submit">Cerrar sesión</button>
            </form>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!--{% if false %}-->
  </template>
  <!--{% endif %}-->
</body>
</html>
