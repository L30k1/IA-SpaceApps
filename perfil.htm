<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSpace - Acceso y Selección de Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030a1c;
      --bg-panel: rgba(11, 25, 56, 0.72);
      --border-glow: rgba(56, 152, 255, 0.45);
      --primary: #1d74f5;
      --primary-hover: #3688ff;
      --accent: #38bdf8;
      --text-main: #f0f6ff;
      --text-muted: #8ca6cc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background: radial-gradient(circle at 50% 20%, #0b2252 0%, #040c21 60%, #020612 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Fondo de estrellas sutil */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(1px 1px at 20% 30%, #ffffff 50%, transparent),
                        radial-gradient(1.5px 1.5px at 70% 15%, #7dd3fc 50%, transparent),
                        radial-gradient(1px 1px at 40% 80%, #ffffff 50%, transparent),
                        radial-gradient(2px 2px at 85% 65%, #38bdf8 50%, transparent);
      background-size: 350px 350px;
      opacity: 0.35;
      pointer-events: none;
    }

    .app-frame {
      width: 100%;
      max-width: 960px;
      min-height: 560px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(14, 95, 224, 0.25), inset 0 0 20px rgba(56, 189, 248, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view { display: none; width: 100%; height: 100%; flex: 1; }
    .view.active { display: flex; }

    /* LOGO SVG */
    .brand-logo { display: flex; align-items: center; gap: 12px; }
    .brand-logo.vertical { flex-direction: column; text-align: center; margin-bottom: 24px; }
    .logo-icon {
      width: 54px; height: 54px;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.7));
    }
    .brand-logo.small .logo-icon { width: 38px; height: 38px; }
    .brand-title { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.5px; }
    .brand-logo.small .brand-title { font-size: 1.25rem; }
    .brand-sub { font-size: 0.85rem; color: var(--accent); font-weight: 400; }

    /* VISTA 1: LOGIN / REGISTRO */
    #view-auth {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .auth-box { width: 100%; max-width: 380px; }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-group svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
    }

    .input-group input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      background: rgba(6, 17, 41, 0.8);
      border: 1px solid rgba(56, 152, 255, 0.35);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: 0.25s;
    }

    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .btn-primary {
      width: 100%;
      padding: 13px 24px;
      background: linear-gradient(90deg, #1659c7, #2684ff);
      border: 1px solid #60a5fa;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 0 18px rgba(38, 132, 255, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, #1d6be8, #4597ff);
      transform: translateY(-1px);
    }

    .auth-switch {
      text-align: center;
      margin-top: 18px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .auth-switch a {
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    /* LAYOUT CON SIDEBAR PARA PANTALLA 2 */
    .sidebar {
      width: 64px;
      background: rgba(4, 12, 30, 0.75);
      border-right: 1px solid rgba(56, 152, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
      gap: 24px;
    }

    .nav-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-icon.active, .nav-icon:hover {
      background: rgba(38, 132, 255, 0.22);
      color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .mission-meta {
      text-align: right;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .mission-meta strong { color: var(--text-main); font-weight: 600; }

    /* VISTA 2: SELECCIÓN DE PERFIL */
    .profile-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .profile-section h2 {
      font-size: 1.35rem;
      font-weight: 500;
      margin-bottom: 28px;
    }

    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: 100%;
      max-width: 680px;
      margin-bottom: 32px;
    }

    .profile-card {
      background: rgba(8, 22, 52, 0.85);
      border: 1.5px solid rgba(56, 152, 255, 0.3);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .profile-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .profile-card.selected {
      border-color: #38bdf8;
      background: rgba(20, 56, 122, 0.65);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.45);
    }

    .avatar-box {
      width: 100%;
      height: 145px;
      border-radius: 10px;
      background: linear-gradient(180deg, #13316c 0%, #07132e 100%);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .profile-role { font-weight: 600; font-size: 1rem; color: var(--text-main); }
    .profile-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

    .btn-continue-wrap { width: 220px; }

    @media (max-width: 720px) {
      .profiles-grid { grid-template-columns: 1fr; max-width: 300px; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <div class="app-frame">
    
    <!-- PANTALLA 1: REGISTRO E INICIO DE SESIÓN -->
    <section id="view-auth" class="view active">
      <div class="brand-logo vertical">
        <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
          <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          <path d="M24 32H28L30.5 26L34 38L36.5 32H40" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="brand-title">MediSpace</div>
          <div class="brand-sub">Crew Health Assistant</div>
        </div>
      </div>

      <form id="auth-form" class="auth-box" data-mode="login">
        <!-- Campo extra visible solo en modo Registro -->
        <div class="input-group hidden" id="field-fullname">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="input-name" placeholder="Nombre y rango (ej. A. Rivera)" />
        </div>

        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input type="email" id="input-email" placeholder="Correo electrónico" required />
        </div>

        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="input-password" placeholder="Contraseña" required />
        </div>

        <button type="submit" class="btn-primary" id="btn-auth-submit">Iniciar sesión →</button>

        <div class="auth-switch">
          <span id="auth-switch-text">¿No tienes cuenta?</span>
          <a id="toggle-auth-mode">Crear cuenta</a>
        </div>
      </form>
    </section>

    <!-- PANTALLA 2: SELECCIÓN DE PERFIL -->
    <section id="view-profile" class="view">
      <aside class="sidebar">
        <div class="nav-icon active" title="Perfil">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </div>
        <div class="nav-icon" title="Signos Vitales">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div class="nav-icon" title="Historial">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div class="nav-icon" title="Ajustes">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
      </aside>

      <div class="main-area">
        <header class="top-header">
          <div class="brand-logo small">
            <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
              <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
              <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
            </svg>
            <div>
              <div class="brand-title">MediSpace</div>
              <div class="brand-sub">Crew Health Assistant</div>
            </div>
          </div>
          <div class="mission-meta">
            <div>Misión: <strong>STS-427</strong></div>
            <div id="utc-clock">14:33:24 UTC</div>
          </div>
        </header>

        <div class="profile-section">
          <h2>Selecciona tu perfil</h2>

          <div class="profiles-grid" id="profiles-container">
            <!-- Perfil 1 -->
            <div class="profile-card selected" data-role="Astronauta" data-crew-id="AS-2743" data-name="A. Rivera">
              <div class="avatar-box">
                <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.5">
                  <circle cx="12" cy="9" r="5"/>
                  <path d="M8.5 8.5a4 4 0 0 1 7 0" stroke="#38bdf8"/>
                  <path d="M4 21v-2a7 7 0 0 1 16 0v2"/>
                </svg>
              </div>
              <div class="profile-role">Astronauta</div>
              <div class="profile-sub">Comandante / EVA</div>
            </div>

            <!-- Perfil 2 -->
            <div class="profile-card" data-role="Investigadora" data-crew-id="SC-1092" data-name="Dra. E. Vance">
              <div class="avatar-box">
                <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                  <path d="M9 14l3 3 3-3"/>
                </svg>
              </div>
              <div class="profile-role">Investigadora</div>
              <div class="profile-sub">Biomedicina Orbital</div>
            </div>

            <!-- Perfil 3 -->
            <div class="profile-card" data-role="Ingeniero" data-crew-id="EN-4410" data-name="Ing. M. Sato">
              <div class="avatar-box">
                <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="1.5">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                  <rect x="9" y="15" width="6" height="4" rx="1"/>
                </svg>
              </div>
              <div class="profile-role">Ingeniero</div>
              <div class="profile-sub">Soporte Vital</div>
            </div>
          </div>

          <div class="btn-continue-wrap">
            <button id="btn-confirm-profile" class="btn-primary">Continuar →</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Estado preparado para integración con Backend / Auth
    const MediSpaceAuthState = {
      mode: 'login', // 'login' | 'register'
      user: null,
      selectedProfile: {
        role: 'Astronauta',
        crewId: 'AS-2743',
        name: 'A. Rivera'
      }
    };

    // Reloj UTC en tiempo real
    setInterval(() => {
      const now = new Date().toISOString().substring(11, 19) + ' UTC';
      const clock = document.getElementById('utc-clock');
      if (clock) clock.textContent = now;
    }, 1000);

    // Alternar Login / Registro
    const toggleBtn = document.getElementById('toggle-auth-mode');
    const authForm = document.getElementById('auth-form');
    const fieldName = document.getElementById('field-fullname');
    const submitBtn = document.getElementById('btn-auth-submit');
    const switchText = document.getElementById('auth-switch-text');

    toggleBtn.addEventListener('click', () => {
      const isLogin = MediSpaceAuthState.mode === 'login';
      MediSpaceAuthState.mode = isLogin ? 'register' : 'login';
      fieldName.classList.toggle('hidden', !isLogin);
      submitBtn.textContent = isLogin ? 'Crear cuenta →' : 'Iniciar sesión →';
      switchText.textContent = isLogin ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?';
      toggleBtn.textContent = isLogin ? 'Iniciar sesión' : 'Crear cuenta';
    });

    // Envío de autenticación (Conectar aquí con API/BD)
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('input-email').value;
      const customName = document.getElementById('input-name').value.trim();

      // TODO: Reemplazar con llamada fetch('/api/auth/login') o Firebase/Supabase Auth
      MediSpaceAuthState.user = {
        email,
        customName: customName || null,
        mission: 'STS-427'
      };

      // Cambiar a Pantalla 2: Selección de perfil
      document.getElementById('view-auth').classList.remove('active');
      document.getElementById('view-profile').classList.add('active');
    });

    // Selección de tarjeta de perfil
    const cards = document.querySelectorAll('.profile-card');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        MediSpaceAuthState.selectedProfile = {
          role: card.dataset.role,
          crewId: card.dataset.crewId,
          name: MediSpaceAuthState.user?.customName || card.dataset.name
        };
      });
    });

    // Confirmar perfil y pasar al Dashboard (archivo 2)
    document.getElementById('btn-confirm-profile').addEventListener('click', () => {
      localStorage.setItem('medispace_session', JSON.stringify(MediSpaceAuthState));
      // Redirección al segundo HTML
      window.location.href = '2_dashboard_antecedentes.html';
    });
  </script>
</body>
</html>
