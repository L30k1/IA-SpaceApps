<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediSpace - Dashboard y Antecedentes Médicos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
  <!--{% if false %}-->
  <main class="app-frame">
    <section class="main-area">
      <h1>MediSpace</h1>
      <p>Inicia el servidor con <code>python main.py</code> para usar los formularios y navegar.</p>
      <p><a href="http://127.0.0.1:5000/">Abrir MediSpace</a></p>
    </section>
  </main>
  <template>
  <!--{% endif %}-->

  <div class="app-frame">
    <!-- SIDEBAR DE NAVEGACIÓN -->
    <aside class="sidebar">
      <a class="nav-icon{{ ' active' if not tab else '' }}" href="{{ url_for('profile') }}" aria-label="Dashboard principal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
      <a class="nav-icon{{ ' active' if tab else '' }}" href="{{ url_for('profile', tab='historial') }}" aria-label="Antecedentes médicos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </a>
      <a class="nav-icon" href="{{ url_for('checkup') }}" aria-label="Asistente IA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </a>
    </aside>

    <div class="main-area">
      <!-- ENCABEZADO -->
      <header class="top-header">
        <div class="brand-logo">
          <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="2.5"/>
            <ellipse cx="32" cy="32" rx="30" ry="10" transform="rotate(-28 32 32)" stroke="#60a5fa" stroke-width="2"/>
          </svg>
          <div>
            <div class="brand-title">MediSpace</div>
            <div class="brand-sub">Crew Health Assistant</div>
          </div>
        </div>
        <div class="mission-meta">
          <div>Misión: <strong>STS-427</strong></div>
          <div id="utc-clock">{{ utc_clock }}</div>
        </div>
      </header>

      <!-- PANTALLA 3: DASHBOARD PRINCIPAL -->
      {% if not tab %}
      <section id="view-dashboard" class="view active">
        <div class="dashboard-grid">
          <div class="left-col">
            <!-- Perfil del Astronauta -->
            <div class="crew-header-card">
              <div class="crew-avatar">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="1.8">
                  <circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                </svg>
              </div>
              <div class="crew-info">
                <h2 id="crew-name">{{ crew.name }}</h2>
                <div class="crew-id" id="crew-id">ID: {{ crew.id }} · {{ crew.role }}</div>
                <div class="status-badge"><span class="dot-green"></span> En misión</div>
              </div>
            </div>

            <!-- Estado de Salud y Chequeos -->
            <div class="health-status-card">
              <div class="health-top">
                <div class="health-indicator">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    <polyline points="9 12 11 14 15 10"/>
                  </svg>
                  <div>
                    <div class="health-label">Resultado del último chequeo simulado</div>
                    <div class="health-value" id="overall-health-status">{{ latest['status'] if latest else 'Pendiente' }}</div>
                  </div>
                </div>
                <svg id="ecg-canvas" width="180" height="52" viewBox="0 0 180 52" role="img" aria-label="Trazado ilustrativo">
                  <polyline points="0,26 20,26 28,20 34,26 44,26 50,35 58,8 66,42 74,26 96,26 104,20 110,26 120,26 126,35 134,8 142,42 150,26 180,26" fill="none" stroke="#4ade80" stroke-width="2"/>
                </svg>
              </div>

              <div class="schedule-list">
                <div class="schedule-item">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <div>Último monitoreo:<strong id="last-checkup">{{ latest['finished_at'] if latest else 'Sin registros' }}</strong></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Accesos Directos -->
          <div class="right-col">
            <a class="action-tile" href="{{ url_for('profile', tab='historial') }}">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
              </svg>
              <span>Historial médico</span>
            </a>

            <a class="action-tile" href="{{ url_for('checkup') }}">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
                <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
              </svg>
              <span>Asistente IA</span>
            </a>

            <a class="btn-primary" href="{{ url_for('checkup') }}">Iniciar monitoreo →</a>
          </div>
        </div>
      </section>

      <!-- PANTALLA 4: ANTECEDENTES MÉDICOS -->
      {% else %}
      <section id="view-medical" class="view active">
        <div class="tabs-bar">
          {% for key, label in [('historial', 'Historial'), ('parametros', 'Parámetros'), ('alergias', 'Alergias')] %}
          <a class="tab-btn{{ ' active' if tab == key else '' }}" href="{{ url_for('profile', tab=key) }}">{{ label }}</a>
          {% endfor %}
        </div>

        <div class="medical-grid">
          <!-- Tarjeta izquierda dinámica según pestaña -->
          <div class="med-card">
            <div>
              <h3>{{ medical[0] }}</h3>
              <ul class="med-list">
                {% for item in medical[1] %}<li>{{ item }}</li>{% endfor %}
              </ul>
            </div>
            <a class="records-link" href="{{ url_for('summary', vista='historial') }}">Ver historial de chequeos →</a>
          </div>

          <!-- Tarjeta derecha: Parámetros habituales base para la IA -->
          <div class="med-card">
            <div>
              <h3>Parámetros habituales de ejemplo</h3>
              <ul class="med-list" id="baseline-vitals">
                <li>❤️ FC: <strong>60–70 lpm</strong></li>
                <li>💧 SpO₂: <strong>98–100%</strong></li>
                <li>🌡️ Temp: <strong>36.4–37.0 °C</strong></li>
                <li>🧠 Nivel de estrés base: <strong>Bajo (15/100)</strong></li>
              </ul>
            </div>
            <div class="baseline-note">
              Antecedentes y parámetros del perfil ficticio.
            </div>
          </div>
        </div>

        <div class="footer-actions">
          <a class="btn-secondary" href="{{ url_for('profile') }}">← Volver al dashboard</a>
          <a class="btn-primary btn-evaluation" href="{{ url_for('checkup') }}">Continuar a chequeo →</a>
        </div>
      </section>
      {% endif %}
    </div>
  </div>

  <!--{% if false %}-->
  </template>
  <!--{% endif %}-->
</body>
</html>
