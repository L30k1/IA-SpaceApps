<!DOCTYPE html>
<html lang="{{ language }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ t("MediSpace · Dashboard and medical history") }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/perfil.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='interfaz.css') }}">
  <link rel="icon" type="image/jpeg" href="{{ url_for('imagen_marca', full_name='medispace-emblema.jpeg') }}">
</head>
<body>
  <!--{% if false %}-->
  <main class="app-frame">
    <section class="main-area">
      <h1>MediSpace</h1>
      <p>Start the server with <code>python main.py</code> to use the forms and navigate the app.</p>
      <p><a href="http://127.0.0.1:5000/">Open MediSpace</a></p>
    </section>
  </main>
  <template>
  <!--{% endif %}-->

  {% set modulos = [
    ('psicologia', t("Psychological support"), url_for('registro_psicologico', module='diario')),
    ('cognicion', t("Cognitive tests"), url_for('pruebas_cognitivas'))
  ] %}
  {% macro icono_modulo(kind, tamano) %}
  <svg width="{{ tamano }}" height="{{ tamano }}" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if kind == 'psicologia' %}
    <path d="M18 20h-5v-3h-2l-2-2v-2H7l2-3a6 6 0 1 1 9 5z"/>
    <path d="m14 10 1 1 2-2"/>
    {% else %}
    <rect x="6" y="5" width="12" height="16" rx="2"/>
    <rect x="9" y="3" width="6" height="4" rx="1"/>
    <path d="m9 12 1 1 2-2m2 1h2m-7 5h7"/>
    {% endif %}
  </svg>
  {% endmacro %}

  <div class="app-frame">
    <!-- NAVIGATION SIDEBAR -->
    <nav class="sidebar" aria-label="{{ t("Profile navigation") }}">
      <a class="nav-icon active" href="{{ url_for('profile') }}" aria-label="{{ t("Main dashboard") }}" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
      <a class="nav-icon" href="{{ url_for('summary', vista='historial') }}" aria-label="{{ t("Medical background") }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </a>
      {% for kind, full_name, destination in modulos %}
      <a class="nav-icon" href="{{ destination }}" title="{{ full_name }}" aria-label="{{ full_name }}">
        {{ icono_modulo(kind, 20) }}
      </a>
      {% endfor %}
    </nav>

    <div class="main-area">
      <!-- HEADER -->
      <header class="top-header">
        <div class="marca-encabezado">
          {% include '_marca.html' %}
          <span class="marca-texto">Crew Health Assistant</span>
        </div>
        <div class="mission-meta">
          <div><strong>{{ medical_record.astronauta.nombre }}</strong></div>
          <div id="utc-clock">{{ utc_clock }}</div>
        </div>

        {% if es_admin %}<a class="btn-primary admin-acceso" href="{{ url_for('admin_cuentas') }}">{{ t("Administration") }}</a>{% endif %}
        {% include '_selector_idioma.html' %}
      </header>

      <!-- SCREEN 3: MAIN DASHBOARD -->
      <section id="view-dashboard" class="view active">
        {% for message in get_flashed_messages() %}<p role="alert">{{ t(message) }}</p>{% endfor %}
        <div class="acciones-principales">
          <a class="btn-primary btn-emergencia" href="{{ url_for('chat_psicologico', modo='emergencia') }}">{{ t("Emergency · Talk to AI") }}</a>
          <form id="iniciar-monitoreo" method="post" action="{{ url_for('checkup') }}">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button class="btn-primary" type="submit" name="iniciar" value="1">{{ t("Start monitoring") }}</button>
          </form>
          {% for _, full_name, destination in modulos %}
          <a class="btn-primary" href="{{ destination }}">{{ full_name }}</a>
          {% endfor %}
        </div>
        <div class="dashboard-grid">
          <div class="left-col">
            <!-- Astronaut profile -->
            <div class="crew-header-card">
              <div class="crew-avatar">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="1.8">
                  <circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                </svg>
              </div>
              <div class="crew-info">
                <h2 id="crew-name">{{ medical_record.astronauta.nombre }}</h2>
                <div class="crew-id" id="crew-id">ID: {{ medical_record._id }} {{ t("· Astronaut") }}</div>
              </div>
            </div>

            <!-- Health status and checkups -->
            <div class="health-status-card">
              <div class="health-top">
                <div class="health-indicator">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    <polyline points="9 12 11 14 15 10"/>
                  </svg>
                  <div>
                    <div class="health-label">{{ t("Latest checkup") }}</div>
                    <div class="health-value" id="overall-health-status">{{ etiquetas_resultado.get(latest.estado, latest.estado or t("Imported")) if latest else t("No records") }}</div>
                  </div>
                </div>
              </div>

              <div class="schedule-list">
                <div class="schedule-item">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <div>{{ t("Last monitored:") }}<strong id="last-checkup">{{ (latest.fecha_hora | utc_time) if latest else t("No records") }}</strong></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Shortcuts -->
          <div class="right-col">
            <a class="action-tile" href="{{ url_for('summary', vista='historial') }}">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
              </svg>
              <span>{{ t('Historial médico') }}</span>
            </a>
            <a class="action-tile" href="{{ url_for('ejercicio') }}">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12h18M5 8v8m4-10v12m6-12v12m4-10v8"/>
              </svg>
              <span>{{ t("Exercise and recovery") }}</span>
            </a>

            <form method="post" action="{{ url_for('logout') }}">
              <input type="hidden" name="csrf" value="{{ csrf }}">
              <button class="btn-secondary" type="submit">{{ t("Sign out") }}</button>
            </form>
          </div>
          {% include '_calendario_mision.html' %}
        </div>
      </section>

    </div>
  </div>

  <!--{% if false %}-->
  </template>
  <!--{% endif %}-->
</body>
</html>
